<script>
'use strict';
const app = document.getElementById('app');
const root = document.getElementById('modal-root');
const state = {screen:'inicio', guide:'foto', step:0, plan:'mes', title:'Cómo mandar una foto', from:'inicio', extra:false};
const icon = (name, cls='') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const esc = str => String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guides = {
 foto:{title:'Cómo mandar una foto',icon:'photo',color:'',steps:[
 {title:'Abre WhatsApp',text:'Busca este ícono verde en tu celular y tócalo.',voice:'Hola, ma. Vamos con calma. Busca el ícono verde de WhatsApp en tu celular y tócalo. No hay prisa.'},
 {title:'Abre nuestro chat',text:'Busca mi nombre, Lalo, y toca la conversación.',voice:'Ahora busca mi nombre, Lalo. Toca nuestra conversación para abrirla. Así como cuando me mandas un mensaje.'},
 {title:'Elige tu foto',text:'Toca el signo + y después Fotos. Elige una imagen.',voice:'Abajo, junto al espacio para escribir, toca el signo más. Elige Fotos y toca la imagen que quieras mandarme.'},
 {title:'Toca la flecha verde',text:'Es el botón de enviar. ¡Tu foto ya va en camino!',voice:'Ya casi. Toca la flecha verde de abajo. ¡Listo! Tu foto ya va en camino. Puedes repetir esta guía cuando quieras.'}
 ]},
 zoom:{title:'Entrar a Zoom',icon:'video',color:'blue',steps:[
 {title:'Abre Zoom',text:'Busca el ícono azul de la cámara y tócalo.',voice:'Vamos paso a paso. Busca el ícono azul de Zoom, que tiene una cámara, y tócalo.'},
 {title:'Toca Entrar',text:'No necesitas crear una cuenta para esta llamada.',voice:'Busca el botón Entrar a una reunión. No tienes que crear una cuenta para entrar a nuestra llamada.'},
 {title:'Escribe el número',text:'Usa el número de reunión que te mandé por WhatsApp.',voice:'Escribe el número de reunión que te mandé por WhatsApp. Los números que ves aquí son solo de ejemplo.'},
 {title:'Activa tu audio',text:'Toca Conectar audio. ¡Ya podemos platicar!',voice:'Por último, toca Conectar audio. Si el celular te pide permiso para usar el micrófono, permite su uso. ¡Ya podemos platicar!'}
 ]},
 letra:{title:'Agrandar la letra',icon:'type',color:'peach',steps:[
 {title:'Abre Configuración',text:'Busca el ícono del engrane en tu celular.',voice:'Busca el ícono de Configuración, que se parece a un engrane. Tócalo una vez.'},
 {title:'Busca Pantalla',text:'Toca Pantalla y brillo. Puede cambiar según tu celular.',voice:'Busca Pantalla y brillo. El nombre puede ser un poquito distinto según tu celular.'},
 {title:'Toca Tamaño del texto',text:'Aquí puedes hacer más grandes las letras.',voice:'Ahora toca Tamaño del texto. Aquí puedes elegir qué tan grandes quieres ver las letras.'},
 {title:'Desliza a la derecha',text:'Mueve el círculo hasta que puedas leer a gusto.',voice:'Mueve el círculo hacia la derecha. Las letras se harán más grandes. Déjalo donde puedas leer a gusto. ¡Listo!'}
 ]}
};
function header(label='',back='inicio',right=''){return `<header class="topbar"><button class="back-button" data-action="go" data-screen="${back}" aria-label="Regresar">${icon('back')}</button><div class="page-label">${label}</div>${right||'<span style="width:39px"></span>'}</header>`}
function nav(active){return `<nav class="bottom-nav" aria-label="Navegación principal"><button class="nav-button ${active==='inicio'?'active':''}" data-action="go" data-screen="inicio" ${active==='inicio'?'aria-current="page"':''}>${icon('book')}Mis guías</button><button class="nav-button ${active==='familia'?'active':''}" data-action="go" data-screen="familia" ${active==='familia'?'aria-current="page"':''}>${icon('family')}Mi familia</button></nav>`}
function home(){return `<section class="screen"><header class="topbar"><div class="brand"><span class="brand-symbol">T<span></span></span>TeLoDejo <span class="demo-tag">Demo</span></div><button class="avatar-button" data-action="go" data-screen="familia" aria-label="Ver mi familia"><span class="avatar lalo">LG</span></button></header><main class="screen-content"><p class="greeting">Hola, <b>Lalo</b> <span aria-hidden="true">☀</span></p><h1 class="headline">Tu paciencia,<br><em>guardada.</em></h1><div class="hero"><div class="hero-copy"><span class="eyebrow">CERCA, AUNQUE NO ESTÉS</span><h2>“Ma, te lo<br>dejo aquí”.</h2><p>Pasos sencillos, tu voz<br>y todo el tiempo del mundo.</p><button class="text-link" data-action="view" data-guide="foto">Ver como mamá ${icon('arrow')}</button></div><div class="hero-art" aria-hidden="true"><div class="mini-phone"><div class="mini-notch"></div><div class="art-photo"></div><div class="art-line"></div><div class="art-line short"></div><div class="art-play">${'<i></i>'.repeat(12)}</div></div><div class="art-heart">${icon('heart')}</div></div></div><div class="section-head"><h2>Mis guías</h2><span class="small-count">3 para compartir</span></div><div class="guide-list">${Object.entries(guides).map(([key,g],i)=>`<button class="guide-card" data-action="view" data-guide="${key}"><span class="guide-icon ${g.color}">${icon(g.icon)}</span><span class="guide-info"><h3>${g.title}</h3><p>4 pasos <span class="tiny-dot"></span> ${i===0?'Para mamá · lista para ver':i===1?'Para papá':'Para mamá'}</p></span>${icon('chevron')}</button>`).join('')}</div><button class="button create-button" data-action="go" data-screen="crear">${icon('plus')}Crear una guía</button><p class="private-note">${icon('lock')}Solo para tu familia. Sin anuncios.</p></main>${nav('inicio')}</section>`}
function thumbnail(n){return `<div class="step-thumbnail" aria-label="Captura ilustrativa con flecha"><div class="thumb-bar"><i></i><i></i><i></i></div><div class="thumb-row"></div><div class="thumb-row"></div><div class="thumb-row"></div><div class="drawn-arrow"></div><div class="thumb-target">${icon(n===1?'whatsapp':n===2?'family':'plus')}</div></div>`}
function create(){const steps=['Abre WhatsApp','Busca nuestro chat','Elige y envía la foto'];return `<section class="screen">${header('Crear una guía','inicio','<span class="demo-tag">Demo</span>')}<main class="screen-content"><h1 class="page-title">Un poquito de ti,<br>en cada paso.</h1><p class="subtitle">Una captura, una flecha y tu voz.<br>Así de sencillo.</p><label for="guide-title" class="field-label">¿QUÉ LE VAS A ENSEÑAR?</label><input id="guide-title" class="title-input" maxlength="60" value="${esc(state.title)}" autocomplete="off"><div class="section-head"><h2>Los pasos</h2><span class="small-count">${state.extra?'4':'3'} capturas de ejemplo</span></div>${[...steps,...(state.extra?['¡Listo! Ya lo hiciste']:[])].map((s,i)=>`<div class="step-edit">${thumbnail(i+1)}<div class="step-edit-body"><span class="eyebrow">PASO ${i+1}</span><h3>${s}</h3><button class="voice-chip" data-action="voice-preview" data-step="${Math.min(i,3)}">${icon('play')}Voz de Lalo · 0:${i===0?'12':i===1?'08':'10'}</button></div></div>`).join('')}<button class="add-step" data-action="add-step">${icon('plus')}${state.extra?'Editar captura de ejemplo':'Agregar un paso'}</button><p class="inline-note">Las capturas y los audios son ilustrativos. La vista previa divide el recorrido en 4 pasos. No uses datos bancarios, códigos ni contraseñas.</p></main><footer class="bottom-actions"><button class="button" data-action="preview">${icon('play')}Probar como mamá</button><button class="text-link" style="align-self:center;padding:5px" data-action="save">Guardar y compartir ${icon('arrow')}</button></footer></section>`}
function capture(g,s){let body='';let title=g==='foto'?'WhatsApp':g==='zoom'?'Zoom':'Configuración';if(g==='foto'){
if(s===0)body=`<div class="app-grid"><div class="app-tile"><div class="app-tile-square green">${icon('whatsapp')}</div>WhatsApp</div><div class="app-tile"><div class="app-tile-square">${icon('photo')}</div>Fotos</div><div class="app-tile"><div class="app-tile-square blue">${icon('video')}</div>Zoom</div><div class="app-tile"><div class="app-tile-square">Aa</div>Notas</div><div class="app-tile"><div class="app-tile-square">☀</div>Clima</div><div class="app-tile"><div class="app-tile-square">12</div>Calendario</div></div>`;
if(s===1)body=`<div class="capture-top">${icon('back')}Chats ${icon('whatsapp','capture-toolbar')}</div><div class="settings-row highlight"><span style="display:flex;align-items:center;gap:9px"><span class="avatar lalo" style="width:30px;height:30px;font-size:10px">LG</span><b>Lalo</b></span><span style="font-size:10px">Hola, ma ♡</span></div><div class="settings-row"><span>Familia</span><span style="font-size:10px">Nos vemos al rato</span></div><div class="settings-row"><span>Ana</span><span style="font-size:10px">Gracias</span></div>`;
if(s===2)body=`<div class="capture-top">${icon('back')}<span class="avatar">LG</span>Lalo ${icon('video','capture-toolbar')}</div><div class="chat-background"><div class="chat-bubble">Ma, ¿me mandas la foto?<span class="chat-time">10:42</span></div></div><div class="compose-row"><span class="target-circle">${icon('plus')}</span><span class="compose-input">Mensaje</span>${icon('mic')}</div><div class="point-arrow"></div><div class="photo-grid">${Array.from({length:6},(_,i)=>`<div class="photo-tile ${i===0?'selected':''}"></div>`).join('')}</div>`;
if(s===3)body=`<div class="capture-top">${icon('back')}<span class="avatar">LG</span>Lalo</div><div class="chat-background"><div class="photo-tile" style="width:150px;height:115px;margin:auto;background:#bdd3af"></div></div><div class="compose-row"><span class="compose-input">Añade un comentario…</span><span class="target-circle" style="background:#3d8f62;color:white">${icon('arrow')}</span></div><div class="point-arrow"></div>`;
}else if(g==='zoom'){
body=`<div class="capture-top" style="background:#4d7e9c">${icon('video')}Zoom · ejemplo</div>`;
body+=s===2?`<div class="generic-instruction" style="min-height:40px;padding-bottom:0">Número de reunión de ejemplo</div><div class="zoom-code">${'123456'.split('').map(n=>`<i>${n}</i>`).join('')}</div><div class="zoom-join">Entrar</div>`:`<div class="generic-instruction">${s===0?'Videollamadas en familia':s===1?'Únete a la llamada de tu familia':'Conecta el sonido para escucharnos'}<strong>${s===0?'Abrir Zoom':s===1?'Entrar a una reunión':'Conectar audio'}</strong></div>`;
}else{
body=`<div class="capture-top" style="background:#5a7168">Configuración · ejemplo</div>`;
body+=s===3?`<div class="generic-instruction" style="font-size:24px;min-height:85px">Así se ve más grande.</div><div class="slider"></div>`:`<div class="settings-row ${s===0?'highlight':''}">Configuración ${icon('chevron')}</div><div class="settings-row ${s===1?'highlight':''}">Pantalla y brillo ${icon('chevron')}</div><div class="settings-row ${s===2?'highlight':''}">Tamaño del texto ${icon('chevron')}</div>`;
}return `<div class="capture-frame"><div class="capture-label">Pantalla ilustrativa · ${title}</div><div class="capture">${body}</div></div>`}
function viewer(){const g=guides[state.guide];const s=g.steps[state.step];return `<section class="screen viewer"><header class="topbar"><button class="back-button" data-action="exit-view" aria-label="Salir de la guía">${icon('back')}</button><div class="page-label">Una guía de Lalo <span>${g.title}</span></div><span class="avatar lalo">LG</span></header><main class="screen-content"><div class="viewer-label"><span>Vamos con calma</span><span>Paso ${state.step+1} de 4</span></div><div class="progress" role="progressbar" aria-valuenow="${state.step+1}" aria-valuemin="1" aria-valuemax="4" aria-label="Avance de la guía">${g.steps.map((_,i)=>`<span class="${i<=state.step?'done':''}"></span>`).join('')}</div><h1>${s.title}</h1><p class="viewer-instruction">${s.text}</p>${capture(state.guide,state.step)}<button class="button listen" data-action="listen">${icon('sound')}<span>Escuchar este paso</span></button><p class="voice-caption">Audio de muestra · voz del dispositivo, no de Lalo</p><p class="reassurance">Puedes escucharlo las veces que quieras.</p></main><footer class="bottom-actions"><button class="button" data-action="next">${state.step===3?'¡Ya lo hice!':'Siguiente paso'} ${icon(state.step===3?'check':'arrow')}</button>${state.step?'<button class="text-link" data-action="previous">Volver al paso anterior</button>':'<p>Sin prisa. Tú llevas el ritmo.</p>'}</footer></section>`}
function finished(){return `<section class="screen finished">${header('Guía completada',state.from)}<main class="screen-content"><div class="success-art">${icon('heart')}</div><span class="eyebrow">UN PASITO MÁS INDEPENDIENTE</span><h1 class="page-title" style="margin-top:15px">¡Lo hiciste!</h1><p class="subtitle">Aquí estará esta guía<br>cuando la necesites.</p><div class="recipient-row" style="justify-content:center"><span class="avatar lalo">LG</span><div style="text-align:left"><h3>Con cariño, Lalo</h3><p>Tu ayuda de siempre, a tu ritmo.</p></div></div></main><footer class="bottom-actions"><button class="button" data-action="repeat">${icon('play')}Volver a ver la guía</button><button class="button secondary" data-action="go" data-screen="inicio">Ver todas las guías</button></footer></section>`}
function invite(){return `<section class="screen">${header('Compartir en familia','crear')}<main class="screen-content"><div class="simple-icon">${icon('link')}</div><h1 class="page-title">Que tu ayuda<br>le quede a la mano.</h1><p class="subtitle">Le mandas un enlace. Lo abre y sigue<br>tus pasos, sin instalar nada.</p><div class="invite-card"><div class="recipient-row"><span class="avatar mama">M</span><div><h3>Para mamá</h3><p>De Lalo, con paciencia ♡</p></div></div><div class="invite-preview"><p>“Ma, te dejé una guía para<br><b>${esc(state.title.toLowerCase())}.</b><br>Ábrela cuando quieras. Aquí estoy.”</p><span>Vista previa del mensaje</span></div></div><label class="field-label" for="share-link">ENLACE DEL PROTOTIPO</label><div class="share-link">${icon('link')}<input id="share-link" readonly value="${esc(shareUrl())}" aria-label="Enlace de la vista para mamá"><button class="copy-button" data-action="copy" aria-label="Copiar enlace">${icon('copy')}</button></div><button class="button whatsapp" data-action="whatsapp">${icon('whatsapp')}Enviar por WhatsApp</button><div class="info-box">${icon('lock')}<p>En la app final, solo las personas invitadas podrán ver tus guías. Este prototipo usa datos ficticios y no ofrece enlaces privados.</p></div><button class="text-link" data-action="view" data-guide="foto" style="width:100%;justify-content:center">Probar el enlace como mamá ${icon('arrow')}</button><p class="demo-bottom">Demo: no se envían mensajes.</p></main></section>`}
function family(){return `<section class="screen">${header('Mi familia','inicio','<span class="demo-tag">Demo</span>')}<main class="screen-content"><div class="family-hero"><div class="family-faces"><span class="avatar big lalo">LG</span><span class="avatar big mama">M</span><span class="avatar big" style="background:#d7dfe4">P</span></div><h1 class="page-title">Tu pequeño círculo.</h1><p class="subtitle">Menos “¿cómo era?”.<br>Más “¡ya pude!”.</p></div><div class="family-row"><span class="avatar mama">M</span><div class="guide-info"><h3>Mamá</h3><p>2 guías para su celular</p></div><span class="pill">Invitada · demo</span></div><div class="family-row"><span class="avatar" style="background:#d7dfe4">P</span><div class="guide-info"><h3>Papá</h3><p>1 guía para su celular</p></div><span class="pill">Invitado · demo</span></div><button class="button secondary" data-action="go" data-screen="invitar">${icon('plus')}Invitar a alguien</button><button class="plan-upsell" data-action="go" data-screen="familia-plus">${icon('spark')}<div><h3>Más cariño, sin límites.</h3><p>Conoce el plan Familia.</p></div>${icon('chevron','last-arrow')}</button><p class="private-note">${icon('lock')}Sin correos ni datos reales en esta demo.</p></main>${nav('familia')}</section>`}
function paywall(){return `<section class="screen">${header('TeLoDejo Familia','familia','<span class="demo-tag">Demo</span>')}<main class="screen-content paywall"><div class="simple-icon">${icon('heart')}</div><span class="eyebrow">AYUDA QUE SE QUEDA</span><h1 class="page-title" style="margin-top:12px">Toda tu familia.<br>Todas tus guías.</h1><p class="subtitle">Un espacio sencillo para acompañarlos,<br>sin estar siempre al teléfono.</p><div class="features">${['Crea todas las guías que necesiten','Compártelas con tu círculo familiar','Capturas, flechas y tu propia voz','Sin anuncios. Sin complicaciones.'].map(x=>`<div class="feature">${icon('check')}${x}</div>`).join('')}</div><div role="radiogroup" aria-label="Elige un plan">${[['mes','Mensual','Sin permanencia','79','/ mes'],['unico','Pago único','Propuesta para primeros usuarios','349','una vez']].map(([key,name,note,price,unit])=>`<button role="radio" aria-checked="${state.plan===key}" class="plan ${state.plan===key?'selected':''}" data-action="plan" data-plan="${key}">${key==='unico'?'<span class="badge">PRECIO DE LANZAMIENTO · PROPUESTA</span>':''}<span class="radio"></span><span class="plan-text"><span class="plan-name">${name}</span><div class="plan-note">${note}</div></span><span class="price">$${price}<span><br>MXN · ${unit}</span></span></button>`).join('')}</div><p class="paywall-fine">Precios propuestos, no una oferta comercial.<br>El alcance del pago único se definiría antes del lanzamiento.</p><button class="button" data-action="checkout">Probar Familia ${icon('arrow')}</button><button class="text-link" data-action="go" data-screen="inicio" style="margin:17px auto;display:flex;justify-content:center">Seguir con mis guías gratis</button><p class="demo-bottom">Solo demostración. No hay cobros ni tarjeta.</p></main></section>`}
function shareUrl(){if(location.protocol==='file:')return location.href.split('#')[0]+'#mama';const u=new URL(location.href);u.hash='mama';u.search='';return u.href}
function stopVoice(){if('speechSynthesis' in window)window.speechSynthesis.cancel();document.querySelectorAll('.is-speaking').forEach(e=>{e.classList.remove('is-speaking');const span=e.querySelector('span');if(span)span.textContent='Escuchar este paso'})}
function speak(text,button){if(!('speechSynthesis' in window)){modal('Tu voz, cerquita','Aquí se escucharía tu grabación. Este navegador no permite el audio de muestra. Puedes seguir la guía leyendo los pasos.','sound');return}if(window.speechSynthesis.speaking){stopVoice();return}const u=new SpeechSynthesisUtterance(text);u.lang='es-MX';u.rate=.86;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='es-MX')||voices.find(v=>v.lang.startsWith('es'))||null;if(button){button.classList.add('is-speaking');const s=button.querySelector('span');if(s)s.textContent='Detener audio'}u.onend=u.onerror=()=>{if(button){button.classList.remove('is-speaking');const s=button.querySelector('span');if(s)s.textContent='Escuchar este paso'}};window.speechSynthesis.speak(u)}
function render(){stopVoice();const screens={inicio:home,crear:create,mama:viewer,listo:finished,invitar:invite,familia:family,'familia-plus':paywall};app.innerHTML=(screens[state.screen]||home)();app.scrollTop=0;window.scrollTo(0,0);document.title=`TeLoDejo · ${state.screen==='mama'?guides[state.guide].title:'Tu paciencia, guardada'}`}
function go(screen,replace=false){state.screen=screen;const hash=screen==='mama'?'mama':screen;if(location.hash!=='#'+hash){history[replace?'replaceState':'pushState']({},'','#'+hash)}render()}
let toastTimer;function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),3300)}
let previousFocus;function modal(title,text,symbol='heart'){previousFocus=document.activeElement;root.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="simple-icon">${icon(symbol)}</div><h2 id="modal-title">${title}</h2><p>${text}</p><button class="button" data-action="close-modal">Entendido</button></section></div>`;root.querySelector('button').focus()}
function closeModal(){root.innerHTML='';if(previousFocus?.isConnected)previousFocus.focus()}
async function copyLink(){const text=shareUrl();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const el=document.getElementById('share-link');el.focus();el.select();if(!document.execCommand('copy'))throw Error('copy')}toast('Enlace del prototipo copiado')}catch{document.getElementById('share-link')?.select();toast('Mantén presionado el enlace para copiarlo')}}
document.addEventListener('input',e=>{if(e.target.id==='guide-title')state.title=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){
case'go':go(b.dataset.screen);break;
case'view':state.from=state.screen;state.guide=b.dataset.guide||'foto';state.step=0;go('mama');break;
case'preview':state.from='crear';state.guide='foto';state.step=0;go('mama');break;
case'exit-view':go(state.from||'inicio');break;
case'next':if(state.step<3){state.step++;render()}else go('listo');break;
case'previous':state.step=Math.max(0,state.step-1);render();break;
case'repeat':state.step=0;go('mama');break;
case'listen':speak(guides[state.guide].steps[state.step].voice,b);break;
case'voice-preview':speak(guides.foto.steps[Number(b.dataset.step)].voice);toast('Audio ilustrativo: voz del dispositivo');break;
case'add-step':if(!state.extra){state.extra=true;render();toast('Paso de ejemplo agregado')}else modal('Una captura y tu voz','En la app final podrías elegir una captura, marcar dónde tocar y grabar tu explicación. Aquí solo usamos ejemplos.','photo');break;
case'save':if(!state.title.trim()){toast('Ponle un nombre a tu guía');document.getElementById('guide-title').focus();break}go('invitar');toast('Vista previa lista · no se guarda en un servidor');break;
case'copy':copyLink();break;
case'whatsapp':modal('Así se compartiría','Se abriría WhatsApp con el enlace y tu mensaje para que tú elijas a quién enviarlo. En esta demo no se abre WhatsApp ni se envía nada.','whatsapp');break;
case'plan':state.plan=b.dataset.plan;render();document.querySelector(`[data-plan="${state.plan}"]`)?.focus({preventScroll:true});break;
case'checkout':modal('Solo estamos probando','Elegiste Familia: '+(state.plan==='mes'?'$79 MXN al mes.':'$349 MXN en un solo pago.')+' Es una propuesta de precio. No hay cobro, suscripción ni datos de tarjeta.','heart');break;
case'close-modal':closeModal();break;
}});
document.addEventListener('keydown',e=>{if(e.target.matches?.('[role="radio"]')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();state.plan=state.plan==='mes'?'unico':'mes';render();document.querySelector(`[data-plan="${state.plan}"]`)?.focus({preventScroll:true});return}if(root.innerHTML&&e.key==='Escape')closeModal();if(root.innerHTML&&e.key==='Tab'){e.preventDefault();root.querySelector('button')?.focus()}});
window.addEventListener('popstate',()=>{const page=location.hash.slice(1)||'inicio';state.screen=['inicio','crear','mama','listo','invitar','familia','familia-plus'].includes(page)?page:'inicio';render()});
const first=location.hash.slice(1);state.screen=['inicio','crear','mama','listo','invitar','familia','familia-plus'].includes(first)?first:'inicio';render();

</script>
</body></html>
